[project]
name = "meetily-server"
version = "0.1.0"
description = "Providend Meeting Assistant backend -- FastAPI resource server validating Entra ID tokens, Postgres-backed."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
# disallow_any_explicit is deliberately NOT set: it fires on every Pydantic BaseModel subclass,
# flagging Any inside Pydantic's own generated __init__ rather than anything we wrote. strict
# already covers disallow_any_generics/warn_return_any, and JSON columns use pydantic.JsonValue
# instead of Any, so no Any is hand-written anywhere in src/.
